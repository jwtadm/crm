{% extends "_base.html" %}
{% set active = "" %}
{% block title %}修改密码 — CRM{% endblock %}
{% block content %}
<div class="page-header">
  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-5px;margin-right:8px;color:var(--accent)"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>账号</span>安全
  </h1>
  <p>修改登录密码。修改完成后，其它设备上的登录会立即失效。</p>
</div>

<div class="card" style="max-width:600px;">
  <div class="card-header"><h2>修改登录密码</h2></div>

  <div id="mustChangeBanner" class="banner-warn hidden" style="margin-bottom:16px;">
    你正在使用临时密码登录，需要先设置自己的密码才能继续使用系统。
  </div>

  <div class="form-stack">
    <label class="form-field">
      <span class="form-label">当前密码</span>
      <div class="input-with-action">
        <input type="password" id="old" placeholder="当前登录密码" autocomplete="current-password">
        <button type="button" class="input-action" data-toggle="old">显示</button>
      </div>
    </label>

    <label class="form-field">
      <span class="form-label">新密码</span>
      <div class="input-with-action">
        <input type="password" id="new" placeholder="至少 8 位" autocomplete="new-password">
        <button type="button" class="input-action" data-toggle="new">显示</button>
      </div>
      <span class="form-hint" id="strengthHint">建议混合大小写字母、数字和符号</span>
    </label>

    <label class="form-field">
      <span class="form-label">确认新密码</span>
      <div class="input-with-action">
        <input type="password" id="new2" placeholder="再输入一次" autocomplete="new-password">
        <button type="button" class="input-action" data-toggle="new2">显示</button>
      </div>
    </label>
  </div>

  <div class="btn-row" style="margin-top:18px;">
    <button class="btn btn-accent" id="btn">保存新密码</button>
    <span id="msg" class="form-msg"></span>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const $ = id => document.getElementById(id);

// 显示/隐藏密码
document.querySelectorAll('.input-action').forEach(btn => {
  btn.onclick = () => {
    const input = $(btn.dataset.toggle);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '隐藏' : '显示';
  };
});

// 实时强度提示（仅提示，最终校验以服务端为准）
$('new').addEventListener('input', () => {
  const v = $('new').value;
  const hint = $('strengthHint');
  if (!v) { hint.textContent = '建议混合大小写字母、数字和符号'; hint.className = 'form-hint'; return; }
  if (v.length < 8) { hint.textContent = '还差 ' + (8 - v.length) + ' 位（至少 8 位）'; hint.className = 'form-hint is-warn'; return; }
  const kinds = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].filter(r => r.test(v)).length;
  if (kinds >= 3 && v.length >= 12) { hint.textContent = '强度很好'; hint.className = 'form-hint is-ok'; }
  else if (kinds >= 2) { hint.textContent = '强度一般，加长或混合符号会更安全'; hint.className = 'form-hint is-ok'; }
  else { hint.textContent = '强度偏弱，建议混合字母、数字和符号'; hint.className = 'form-hint is-warn'; }
});

function showMsg(text, kind) {
  const el = $('msg');
  el.textContent = text || '';
  el.className = 'form-msg ' + (kind || '');
}

$('btn').onclick = async () => {
  const oldP = $('old').value, newP = $('new').value, new2 = $('new2').value;
  showMsg('');
  if (!oldP) { showMsg('请输入当前密码', 'is-err'); $('old').focus(); return; }
  if (newP.length < 8) { showMsg('新密码至少 8 位', 'is-err'); $('new').focus(); return; }
  if (newP !== new2) { showMsg('两次输入的新密码不一致', 'is-err'); $('new2').focus(); return; }
  if (newP === oldP) { showMsg('新密码不能和当前密码相同', 'is-err'); $('new').focus(); return; }

  const btn = $('btn');
  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    const r = await fetch('/api/auth/change_password', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({old: oldP, new: newP}),
    });
    const data = await r.json();
    if (!r.ok) {
      const map = {wrong_password: '当前密码错误', weak_password: '新密码太弱（至少 8 位）'};
      showMsg(map[data.error] || data.error || '修改失败', 'is-err');
      return;
    }
    showMsg('密码已更新', 'is-ok');
    toast('密码已更新', 'ok');
    $('old').value = $('new').value = $('new2').value = '';
    $('mustChangeBanner').classList.add('hidden');
    // 临时密码场景改完即可进入系统
    setTimeout(() => {
      location.href = (window.CURRENT_USER && window.CURRENT_USER.role === 'admin') ? '/stats' : '/people';
    }, 700);
  } catch (e) {
    showMsg('网络错误：' + e.message, 'is-err');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存新密码';
  }
};

// 临时密码登录时说明原因
(async () => {
  for (let i = 0; i < 40 && !window.CURRENT_USER; i++) await new Promise(r => setTimeout(r, 50));
  if (window.CURRENT_USER && window.CURRENT_USER.must_change_pw) {
    $('mustChangeBanner').classList.remove('hidden');
  }
  $('old').focus();
})();
</script>
{% endblock %}
