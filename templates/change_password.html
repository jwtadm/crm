{% extends "_base.html" %}
{% set active = "" %}
{% block title %}修改密码 — Scout{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <h1>修改密码</h1>
      <p>更新您的登录密码</p>
    </div>
    <div class="login-body">
      <input type="password" id="old" placeholder="当前密码">
      <input type="password" id="new" placeholder="新密码（至少 8 位）">
      <input type="password" id="new2" placeholder="再输一次新密码">
      <button class="btn btn-accent login-btn" id="btn">提交</button>
      <div id="msg" class="login-msg"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('btn').onclick = async () => {
  const oldP = document.getElementById('old').value;
  const newP = document.getElementById('new').value;
  const new2 = document.getElementById('new2').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if (newP.length < 8) { msg.innerHTML = '<span style="color:var(--red)">新密码至少 8 位</span>'; return; }
  if (newP !== new2)  { msg.innerHTML = '<span style="color:var(--red)">两次输入的新密码不一致</span>'; return; }
  const r = await fetch('/api/auth/change_password', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({old: oldP, new: newP}),
  });
  const data = await r.json();
  if (!r.ok) {
    if (data.error === 'wrong_password') msg.innerHTML = '<span style="color:var(--red)">当前密码错误</span>';
    else if (data.error === 'weak_password') msg.innerHTML = '<span style="color:var(--red)">新密码至少 8 位</span>';
    else msg.innerHTML = '<span style="color:var(--red)">修改失败: ' + (data.error || '') + '</span>';
    return;
  }
  msg.innerHTML = '<span style="color:var(--green)">修改成功，跳转中…</span>';
  setTimeout(() => location.href = '/', 1000);
};
</script>
{% endblock %}
