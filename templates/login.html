{% extends "_base.html" %}
{% set active = "" %}
{% block title %}登录 — CRM{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <h1>CRM</h1>
      <p>IG Creator CRM</p>
    </div>
    <div class="login-body">
      <input type="text" id="username" placeholder="用户名" autocomplete="username">
      <input type="password" id="password" placeholder="密码" autocomplete="current-password">
      <label class="login-remember">
        <input type="checkbox" id="remember">记住我（30 天）
      </label>
      <button class="btn btn-accent login-btn" id="loginBtn">登录</button>
      <div id="msg" class="login-msg"></div>
      <div class="login-footer">
        还没账号？<a href="/register">注册</a> · 忘记密码请联系管理员
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next') || '/';

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const r = await fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password, remember}),
  });
  const data = await r.json();
  if (!r.ok) {
    if (data.error === 'rate_limited')      msg.innerHTML = '<span style="color:var(--red)">尝试过于频繁，请稍后再试</span>';
    else if (data.error === 'account_disabled') msg.innerHTML = '<span style="color:var(--red)">账号尚未激活或已被停用</span>';
    else                                     msg.innerHTML = '<span style="color:var(--red)">用户名或密码错误</span>';
    return;
  }
  if (data.user && data.user.must_change_pw) {
    location.href = '/change_password';
  } else {
    location.href = next;
  }
}

document.getElementById('loginBtn').onclick = doLogin;
['username', 'password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});
</script>
{% endblock %}
