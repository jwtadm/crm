{% extends "_base.html" %}
{% set active = "database" %}
{% block title %}平台账号 · CRM{% endblock %}
{% block content %}
<div class="page-header">
  <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-5px;margin-right:8px;color:var(--accent)"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>平台 <span>账号</span></h1>
  <p>已收集的所有账号。点击任意行查看 / 编辑 CRM 信息；可按文字过滤、按描述重排、导出 Excel。</p>
</div>

<div class="card">
  <div class="list-controls">
    <input type="text" id="textFilter" placeholder="按昵称/简介/分类过滤" style="flex:1; min-width:240px;" oninput="debouncedLoad()">
    <input type="text" id="descInput" placeholder="按描述用 embedding 重排" style="flex:2; min-width:280px;" oninput="debouncedLoad()">
    <label class="platform-filter"><input type="checkbox" class="plat-cb" value="instagram" checked> Instagram</label>
    <label class="platform-filter"><input type="checkbox" class="plat-cb" value="tiktok" checked> TikTok</label>
    <label class="platform-filter"><input type="checkbox" class="plat-cb" value="x" checked> X</label>
  </div>
  <div class="btn-row" style="margin-top:6px;">
    <button class="btn btn-orange btn-sm" onclick="embedMissing()" title="给所有还没生成 embedding 的账号补一遍 embedding。重排功能依赖它。">补全 bio embedding</button>
    <button class="btn btn-green btn-sm" id="exportBtn" onclick="exportExcel()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      导出 Excel
    </button>
    <button class="btn btn-ghost btn-sm" onclick="clearDb()" style="color: var(--red); border-color: var(--red);">清空数据库</button>
    <span id="opStatus" style="color:var(--text2); font-size:12px;"></span>
    <span id="dbCount" style="color:var(--text2); font-size:12px; margin-left:auto;"></span>
  </div>
  <div id="exportProgress" style="display:none; margin-top:10px;">
    <div class="progress-track"><div class="progress-fill" id="exportFill"></div></div>
    <div id="exportLabel" style="font-size:11.5px; color:var(--text-2); margin-top:6px;"></div>
  </div>
  <div id="dbList" class="list" style="margin-top:12px; max-height:none;"><div class="empty">加载中…</div></div>
  <div id="dbMore" class="load-more" style="display:none;"></div>
</div>

<!-- 详情抽屉 -->
<div id="drawer" class="drawer hidden">
  <div class="drawer-head">
    <div class="drawer-head-main">
      <h2 class="drawer-title">账号详情</h2>
      <div class="drawer-sub" id="drawerSub"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()" title="关闭 (Esc)">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot" style="display:none;"></div>
</div>

{% endblock %}

{% block scripts %}
<script>
const STATUS_LABEL = {'待联系': '待联系', '已联系': '已联系', '已回复': '已回复', '已成交': '已成交', '主动来找': '主动来找', '不适合': '不适合', '已放弃': '已放弃'};
const STATUS_LIST = ['待联系', '已联系', '已回复', '已成交', '主动来找', '不适合', '已放弃'];
let _t = null;
function debouncedLoad() { clearTimeout(_t); _t = setTimeout(loadList, 300); }

// Sequence guard: rapid filter changes fire overlapping requests; without this
// an older, slower response can land after a newer one and overwrite the list
// with stale data (the "why am I seeing the previous filter's rows" bug).
let _listSeq = 0;

// Scroll pagination. Previously this page always asked for limit=500 and had
// no offset, so of 45k accounts only the top 500 were ever reachable.
// A description-based rerank re-sorts the batch in Python, so paging does not
// compose with it — that mode stays single-batch and the footer says so.
const DB_BATCH = 20;
let _dbOffset = 0;
let _dbCount = 0;
let _dbLoading = false;
let _dbDone = false;

function dbParams(offset) {
  const params = new URLSearchParams();
  const text = document.getElementById('textFilter').value.trim();
  const desc = document.getElementById('descInput').value.trim();
  const plats = [...document.querySelectorAll('.plat-cb:checked')].map(cb => cb.value);
  if (text) params.set('text', text);
  if (desc) params.set('description', desc);
  if (plats.length) params.set('platforms', plats.join(','));
  if (desc) {
    params.set('limit', '500');         // rerank mode: one batch, no paging
  } else {
    params.set('limit', String(DB_BATCH));
    params.set('offset', String(offset));
  }
  return {params, rerank: !!desc};
}

function updateDbFooter() {
  const el = document.getElementById('dbMore');
  const cnt = document.getElementById('dbCount');
  if (cnt) {
    cnt.textContent = _dbCount
      ? `已加载 ${_dbCount.toLocaleString()} 个${_dbDone ? '（已全部）' : ''}`
      : '';
  }
  if (!el) return;
  if (_dbDone) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = _dbLoading
    ? '<span class="spinner" style="display:inline-block;vertical-align:-2px;margin-right:6px;"></span>正在加载下一批…'
    : '继续向下滚动加载更多';
}

function bindDbRows() {
  document.querySelectorAll('#dbList .acct-row').forEach(it => {
    if (it.dataset.bound) return;
    it.dataset.bound = '1';
    it.addEventListener('click', e => {
      if (e.target.tagName === 'A') return;
      openDrawer(+it.dataset.id);
    });
  });
}

// Compact two-line row for the account browser. The shared renderAccount()
// card is 4-5 lines tall, which is fine for a 20-result discovery list but
// makes scanning 45k accounts painful.
function renderAccountRow(a, showScore) {
  const initial = ((a.username || a.full_name || '?') + '').trim().slice(0, 1).toUpperCase() || '?';
  const avatar = '<div class="avatar">' + escapeHtml(initial) + '' +
    (a.profile_pic_url
      ? '<img src="' + a.profile_pic_url + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add(\'is-loaded\')" onerror="this.remove()">'
      : '') + '</div>';
  const verified = a.is_verified ? '<span class="check" title="平台认证">&#10003;</span>' : '';
  const cat = a.category ? '<span class="cat-tag">' + escapeHtml(a.category) + '</span>' : '';
  const stats = [];
  if (a.follower_count != null) stats.push('<b>' + fmt(a.follower_count) + '</b> 粉丝');
  if (a.following_count != null) stats.push('<b>' + fmt(a.following_count) + '</b> 关注');
  if (a.post_count != null) stats.push('<b>' + fmt(a.post_count) + '</b> 帖');
  const statsHtml = stats.length ? '<span class="acct-stats">' + stats.join(' · ') + '</span>' : '';
  const score = (showScore && a.score != null)
    ? '<span class="acct-score">' + (a.score * 100).toFixed(0) + '%</span>' : '';
  const email = a.email ? '<div class="acct-email" title="' + escapeHtml(a.email) + '">&#9993; ' + escapeHtml(a.email) + '</div>' : '';
  const src = a.source ? '<span class="acct-src" title="来源">' + escapeHtml(a.source) + '</span>' : '';
  const bio = a.biography ? '<span class="acct-bio" title="' + escapeHtml(a.biography) + '">' + escapeHtml(a.biography.replace(/\n/g, ' · ')) + '</span>' : '<span class="acct-bio" style="opacity:.6">（无简介）</span>';
  return '<div class="acct-row" data-id="' + a.id + '">' + avatar +
    '<div class="acct-main">' +
      '<div class="acct-line1">' +
        platformTag(a.platform) +
        '<span class="acct-handle">@' + escapeHtml(a.username || '') + '</span>' + verified +
        '<span class="acct-name">' + escapeHtml(a.full_name || '') + '</span>' + cat + score +
        statsHtml +
      '</div>' +
      '<div class="acct-line2">' + bio + '</div>' +
    '</div>' +
    '<div class="acct-right">' + email + src + '</div>' +
  '</div>';
}

async function loadList() {
  const seq = ++_listSeq;
  const {params, rerank} = dbParams(0);
  _dbOffset = 0; _dbCount = 0; _dbDone = false;
  document.getElementById('dbList').innerHTML = skeletonList(8, {avatar:true});
  updateDbFooter();
  try {
    const r = await fetch('/api/db/list?' + params.toString());
    const d = await r.json();
    if (seq !== _listSeq) return;   // superseded by a newer request
    if (d.error) throw new Error(d.error);
    const list = d.accounts || [];
    _dbCount = list.length;
    _dbOffset = rerank ? list.length : list.length;
    _dbDone = rerank || list.length < DB_BATCH;
    const showScore = !!params.get('description');
    document.getElementById('dbList').innerHTML = list.length
      ? '<div class="acct-list">' + list.map(a => renderAccountRow(a, showScore)).join('') + '</div>'
      : '<div class="empty">数据库为空。去 Query 搜索或相似发现页面跑一次。</div>';
    bindDbRows();
    updateDbFooter();
  } catch (e) {
    if (seq !== _listSeq) return;   // aborted or superseded — don't clobber the UI
    document.getElementById('dbList').innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`;
  }
}

async function loadMoreDb() {
  if (_dbLoading || _dbDone || !_dbOffset) return;
  const seq = _listSeq;
  _dbLoading = true;
  updateDbFooter();
  try {
    const {params, rerank} = dbParams(_dbOffset);
    if (rerank) { _dbDone = true; return; }
    const r = await fetch('/api/db/list?' + params.toString());
    const d = await r.json();
    if (seq !== _listSeq) return;
    if (d.error) throw new Error(d.error);
    const list = d.accounts || [];
    if (!list.length) { _dbDone = true; return; }
    // append inside the list wrapper so the border/rounding stays continuous
    const wrap = document.querySelector('#dbList .acct-list') || document.getElementById('dbList');
    wrap.insertAdjacentHTML('beforeend', list.map(a => renderAccountRow(a, false)).join(''));
    bindDbRows();
    _dbOffset += list.length;
    _dbCount += list.length;
    if (list.length < DB_BATCH) _dbDone = true;
  } catch (e) {
    const el = document.getElementById('dbMore');
    if (el && seq === _listSeq) el.textContent = `加载失败：${e.message}（点击重试）`;
  } finally {
    _dbLoading = false;
    updateDbFooter();
  }
}

function initDbScroll() {
  const el = document.getElementById('dbMore');
  if (!el) return;
  el.addEventListener('click', () => loadMoreDb());
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) loadMoreDb();
    }, {rootMargin: '320px 0px'}).observe(el);
  } else {
    window.addEventListener('scroll', () => {
      if (el.getBoundingClientRect().top < window.innerHeight + 400) loadMoreDb();
    }, {passive: true});
  }
}

async function openDrawer(accountId) {
  const drawer = document.getElementById('drawer');
  drawer.classList.remove('hidden');
  document.getElementById('drawerSub').textContent = '';
  document.getElementById('drawerFoot').style.display = 'none';
  document.getElementById('drawerBody').innerHTML = drawerSkeleton();
  try {
    const r = await fetch(`/api/db/account/${accountId}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const a = d.account;
    const p = d.person || {};
    const siblings = d.other_accounts_for_person || [];
    const tags = (() => { try { return JSON.parse(p.tags || '[]'); } catch { return []; } })();
    document.getElementById('drawerSub').textContent =
      `${a.platform} · id ${a.id}` + (p.id ? ` · 客户 #${p.id}` : '');

    const meta = [];
    if (a.follower_count != null) meta.push(`<b>${fmt(a.follower_count)}</b> 粉丝`);
    if (a.following_count != null) meta.push(`<b>${fmt(a.following_count)}</b> 关注`);
    if (a.post_count != null) meta.push(`<b>${fmt(a.post_count)}</b> 帖子`);

    document.getElementById('drawerBody').innerHTML = `
      <div class="dsec">
        <div class="drawer-acct">
          <div class="avatar">${escapeHtml(((a.username || '?') + '').slice(0,1).toUpperCase())}${a.profile_pic_url ? `<img src="${a.profile_pic_url}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add('is-loaded')" onerror="this.remove()">` : ''}</div>
          <div class="da-main">
            <div class="da-line1">
              ${platformTag(a.platform)}
              <span class="da-handle">@${escapeHtml(a.username || '')}</span>
              ${a.is_verified ? '<span class="check" title="平台认证">&#10003;</span>' : ''}
              <span class="da-name">${escapeHtml(a.full_name || '')}</span>
            </div>
            <div class="da-line2">
              ${meta.join(' · ') || '暂无统计数据'}
              ${a.category ? ` · ${escapeHtml(a.category)}` : ''}
            </div>
            ${a.biography ? `<div class="da-line2" style="margin-top:4px">${escapeHtml(a.biography.split('\n').join(' · '))}</div>` : ''}
            ${a.source ? `<div class="da-line2" style="margin-top:2px;font-style:italic">来源：${escapeHtml(a.source)}</div>` : ''}
          </div>
        </div>
      </div>

      <div class="dsec">
        <div class="dsec-title">人物档案（CRM）</div>
        ${p.id ? `<div class="panel">
          <div class="field">
            <span class="field-label">邮箱</span>
            <span class="cell-email">${escapeHtml(p.email || '（无 — 按平台 ID 标识）')}</span>
          </div>
          <div class="field">
            <span class="field-label">状态</span>
            <select id="crmStatus">
              ${STATUS_LIST.map(s2 => `<option value="${s2}" ${s2 === p.status ? 'selected' : ''}>${STATUS_LABEL[s2]}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <span class="field-label">标签</span>
            <input type="text" id="crmTags" value="${escapeHtml(tags.join(', '))}" placeholder="逗号分隔">
          </div>
          <div class="field">
            <span class="field-label">负责人</span>
            <input type="text" id="crmOwner" value="${escapeHtml(p.owner || '')}" placeholder="负责人姓名">
          </div>
          <div class="field stack">
            <span class="field-label">备注</span>
            <textarea id="crmNotes" rows="3" placeholder="联系进度 / 对方在意什么">${escapeHtml(p.notes || '')}</textarea>
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:12px;">
            <button class="btn btn-accent btn-sm" onclick="savePerson(${p.id}, this)">保存</button>
            <span id="crmSaveStatus" class="form-msg"></span>
          </div>
        </div>` : '<div class="dsec-hint">这条账号还没有关联的客户记录，暂时不能编辑档案。</div>'}
      </div>

      ${siblings.length ? `<div class="dsec">
        <div class="dsec-title">同一人物的其他账号 <span class="count">${siblings.length}</span></div>
        ${siblings.map(s2 => renderAccountRow(s2, false)).join('')}
      </div>` : ''}
    `;

    const foot = document.getElementById('drawerFoot');
    foot.style.display = '';
    foot.innerHTML = `<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteAccount(${a.id})">删除此账号</button>
      <span class="dsec-hint" style="margin-left:10px;">只删这条平台账号；客户本身保留。</span>`;
  } catch (e) {
    document.getElementById('drawerBody').innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`;
  }
}

// 抽屉加载占位（与真实内容同形，避免"加载中…"文字闪一下）
function drawerSkeleton() {
  return `<div class="dsec">
      <div class="skeleton" style="height:72px;border-radius:var(--r)"></div>
    </div>
    <div class="dsec">
      <div class="skeleton sk-line" style="width:120px;margin-bottom:10px"></div>
      <div class="skeleton" style="height:200px;border-radius:var(--r)"></div>
    </div>`;
}
function closeDrawer() { document.getElementById('drawer').classList.add('hidden'); }

async function savePerson(pid, btn) {
  const status = document.getElementById('crmStatus').value;
  const tags = document.getElementById('crmTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const owner = document.getElementById('crmOwner').value.trim();
  const notes = document.getElementById('crmNotes').value;
  setBusy(btn, true);
  try {
    const r = await fetch(`/api/db/person/${pid}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status, tags, owner, notes}),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    document.getElementById('crmSaveStatus').textContent = '✓ 已保存';
    setTimeout(() => { document.getElementById('crmSaveStatus').textContent=''; }, 2000);
  } catch (e) { alert('保存失败：' + e.message); }
  finally { setBusy(btn, false); }
}

async function deleteAccount(id) {
  if (!confirm('删除此账号？如果它是该人物的最后一个账号，会一并删除人物记录。')) return;
  try {
    const r = await fetch(`/api/db/account/${id}`, {method:'DELETE'});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    closeDrawer();
    loadList();
    refreshNavStats();
  } catch (e) { alert('删除失败：' + e.message); }
}

async function embedMissing() {
  document.getElementById('opStatus').textContent = '正在生成 embedding…';
  try {
    const r = await fetch('/api/db/embed_missing', {method:'POST'});
    const d = await r.json();
    document.getElementById('opStatus').textContent = `已为 ${d.updated || 0} 个账号生成 embedding`;
  } catch (e) { document.getElementById('opStatus').textContent = '失败：' + e.message; }
}

// Export runs as a background job so the button can show a real percentage
// instead of going silent for several seconds. The old flow was: click →
// nothing happens → (maybe) a file appears.
async function exportExcel() {
  const btn = document.getElementById('exportBtn');
  const box = document.getElementById('exportProgress');
  const fill = document.getElementById('exportFill');
  const label = document.getElementById('exportLabel');
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.textContent = '导出中…';
  box.style.display = '';
  fill.className = 'progress-fill indeterminate';
  label.textContent = '正在准备数据…';
  try {
    const start = await fetch('/api/db/export/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}',
    });
    const {job_id} = await start.json();
    if (!job_id) throw new Error('无法创建导出任务');

    let job = null;
    for (let i = 0; i < 1200; i++) {          // up to ~6 min at 300ms
      await new Promise(r => setTimeout(r, 300));
      const r = await fetch('/api/db/export/' + job_id);
      job = await r.json();
      if (job.error && job.status !== 'running') throw new Error(job.error);
      if (job.status === 'running') {
        if (job.total) {
          fill.className = 'progress-fill';
          fill.style.width = job.percent + '%';
          label.textContent = '正在写入 ' + job.done.toLocaleString()
            + ' / ' + job.total.toLocaleString() + ' 行（' + job.percent + '%）';
        } else {
          label.textContent = '正在读取账号…';
        }
        continue;
      }
      break;
    }
    if (!job || !job.ready) throw new Error(job && job.error ? job.error : '导出超时');
    fill.className = 'progress-fill';
    fill.style.width = '100%';
    label.textContent = '完成：' + job.total.toLocaleString() + ' 行，开始下载…';
    // trigger the download through a normal navigation so the browser shows
    // its own download progress
    const a = document.createElement('a');
    a.href = '/api/db/export/' + job_id + '/file';
    a.download = 'creators.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    toast('导出完成，已开始下载', 'ok');
    setTimeout(() => { box.style.display = 'none'; fill.style.width = '0'; }, 4000);
  } catch (e) {
    label.textContent = '导出失败：' + e.message;
    fill.className = 'progress-fill';
    fill.style.background = 'var(--red)';
    toast('导出失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function clearDb() {
  if (!confirm('⚠️  确定要删除全部账号和人物？此操作不可恢复。')) return;
  try {
    const r = await fetch('/api/db/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({confirm: true})});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    loadList();
    refreshNavStats();
  } catch (e) { alert('清空失败：' + e.message); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('drawer').classList.contains('hidden')) {
    closeDrawer();
  }
});
document.querySelectorAll('.plat-cb').forEach(cb => cb.addEventListener('change', loadList));
initDbScroll();
loadList();
</script>
{% endblock %}
