{% extends "_base.html" %}
{% set active = "" %}
{% block title %}注册 — CRM{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <h1>CRM</h1>
      <p>新员工注册</p>
    </div>
    <div class="login-body">
      <p style="font-size:12px; color:var(--text-2); text-align:center; margin-bottom:4px;">
        注册后需管理员审核才能登录
      </p>
      <input type="text" id="username" placeholder="用户名（字母数字下划线）">
      <input type="text" id="email" placeholder="邮箱（可选）">
      <input type="text" id="display_name" placeholder="显示名（中文/真名）">
      <input type="password" id="password" placeholder="密码（至少 8 位）">
      <button class="btn btn-accent login-btn" id="registerBtn">提交注册</button>
      <div id="msg" class="login-msg"></div>
      <div class="login-footer">
        已有账号？<a href="/login">登录</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function doRegister() {
  const payload = {
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    display_name: document.getElementById('display_name').value.trim(),
    password: document.getElementById('password').value,
  };
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const r = await fetch('/api/auth/register', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const data = await r.json();
  if (!r.ok) {
    const map = {
      rate_limited: '注册过于频繁，请稍后再试',
      missing_fields: '用户名和密码必填',
      weak_password: '密码至少 8 位',
      username_taken: '该用户名已被注册',
      email_taken: '该邮箱已被注册',
    };
    msg.innerHTML = `<span style="color:var(--red)">${map[data.error] || ('注册失败: ' + (data.error || '未知错误'))}</span>`;
    return;
  }
  msg.innerHTML = '<span style="color:var(--green)">注册成功！等待管理员审核激活后即可登录。</span>';
  setTimeout(() => location.href = '/login', 2000);
}
document.getElementById('registerBtn').onclick = doRegister;
</script>
{% endblock %}
