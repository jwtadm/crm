{% extends "_base.html" %}
{% set active = "" %}
{% block title %}注册 — Scout{% endblock %}
{% block content %}
<div class="page-header"><h1><span>注册</span></h1>
<p>新员工注册后需管理员审核才能登录。</p>
</div>
<div class="card" style="max-width: 460px; margin: 0 auto;">
  <div class="input-row" style="flex-direction:column; align-items:stretch; gap:10px;">
    <input type="text" id="username" placeholder="用户名（登录用，仅字母数字下划线）">
    <input type="text" id="email" placeholder="邮箱（可选）">
    <input type="text" id="display_name" placeholder="显示名（中文/真名）">
    <input type="password" id="password" placeholder="密码（至少 8 位）">
    <button class="btn btn-accent" id="registerBtn">提交注册</button>
    <div id="msg" style="font-size:12px; min-height:18px;"></div>
    <div style="font-size:12px; color:var(--text2); text-align:center;">
      已有账号？<a href="/login" style="color:var(--accent);">登录</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function doRegister() {
  const payload = {
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    display_name: document.getElementById('display_name').value.trim(),
    password: document.getElementById('password').value,
  };
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const r = await fetch('/api/auth/register', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const data = await r.json();
  if (!r.ok) {
    const map = {
      rate_limited: '注册过于频繁，请稍后再试',
      missing_fields: '用户名和密码必填',
      weak_password: '密码至少 8 位',
      username_taken: '该用户名已被注册',
      email_taken: '该邮箱已被注册',
    };
    msg.innerHTML = `<span style="color:var(--red)">${map[data.error] || ('注册失败: ' + (data.error || '未知错误'))}</span>`;
    return;
  }
  msg.innerHTML = '<span style="color:var(--green)">注册成功！等待管理员审核激活后即可登录。</span>';
  setTimeout(() => location.href = '/login', 2000);
}
document.getElementById('registerBtn').onclick = doRegister;
</script>
{% endblock %}
