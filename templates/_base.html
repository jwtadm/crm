<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CRM{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_v }}">
<script>
// Apply the saved colour theme before first paint (no flash of the default).
try {
  const t = localStorage.getItem('crm-theme');
  if (t === 'ocean' || t === 'sunset' || t === 'indigo') {
    document.documentElement.dataset.theme = t;
  }
} catch (e) {}
</script>
</head>
<body data-active="{{ active or '' }}">
<!-- 全局加载条：所有 fetch 共用，慢请求才出现，避免每点一下闪一下 -->
<div id="topProgress" aria-hidden="true"><i></i></div>
<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand" style="text-decoration:none;">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 17 4-8 4 4 5-9"/></svg></span>
      <span class="brand-text">CRM</span>
    </a>
    <a class="navlink" id="navStats" href="/stats">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 17l4-4 4 4 5-5"/></svg>
      <span class="nav-label">统计</span>
    </a>
    <a class="navlink admin-only hidden" id="navSimilarity" href="/similarity">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>
      <span class="nav-label">相似发现</span>
    </a>
    <a class="navlink admin-only hidden" id="navQuery" href="/query">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>
      <span class="nav-label">Query</span>
    </a>
    <a class="navlink" id="navPeople" href="/people">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">客户管理</span>
    </a>
    <a class="navlink admin-only hidden" id="navDatabase" href="/database">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
      <span class="nav-label">平台账号</span>
    </a>
    <div class="nav-sep admin-only hidden" id="navSep1"></div>
    <a class="navlink admin-only hidden" id="navSettings" href="/settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="nav-label">设置</span>
    </a>
    <a class="navlink admin-only hidden" id="navAdminUsers" href="/admin/users">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
      <span class="nav-label">员工</span>
    </a>
    <a class="navlink" id="navMe" href="/me">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
      <span class="nav-label">我的</span>
    </a>
    <div class="nav-stats" id="navStatsBar"></div>
    <div class="nav-user" id="navUser"></div>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
<script>
const PLATFORM_LABEL = {instagram: 'IG', tiktok: 'TikTok', x: 'X'};
const ALL_PLATFORMS = ['instagram', 'tiktok', 'x'];
window.CURRENT_USER = null;

// ── Global request lifecycle: abort in-flight requests on page unload ──
let _pageAC = new AbortController();
const _origFetch = window.fetch;

// ── Global loading bar ───────────────────────────────────────
// One bar for every request. It only appears after 130ms, so fast calls
// (most of them) never flash; background pollers are excluded entirely.
const _tp = document.getElementById('topProgress');
const _tpFill = _tp && _tp.querySelector('i');
let _tpPending = 0, _tpShowTimer = null, _tpHideTimer = null;
const _POLL_RE = /\/api\/(reminders\/due|db\/export\/[^/]+|similarity\/bulk\/|hydrate\/bulk\/|email\/job\/)/;

function _tpStart(quiet) {
  if (quiet || !_tp) return;
  _tpPending++;
  if (_tpPending !== 1) return;
  clearTimeout(_tpHideTimer);
  _tpShowTimer = setTimeout(() => {
    if (!_tpPending) return;
    _tpFill.style.transition = 'none';
    _tpFill.style.transform = 'scaleX(.06)';
    _tp.classList.add('on');
    void _tpFill.offsetWidth;   // flush the 6% so the grow is animated
    _tpFill.style.transition = 'transform 1.1s cubic-bezier(.2,.8,.25,1)';
    _tpFill.style.transform = 'scaleX(.74)';
  }, 130);
}

function _tpEnd(quiet) {
  if (quiet || !_tp) return;
  _tpPending = Math.max(0, _tpPending - 1);
  if (_tpPending) return;
  clearTimeout(_tpShowTimer);
  if (!_tp.classList.contains('on')) return;
  _tpFill.style.transition = 'transform .18s ease-out';
  _tpFill.style.transform = 'scaleX(1)';
  _tpHideTimer = setTimeout(() => {
    _tp.classList.remove('on');
    setTimeout(() => {
      _tpFill.style.transition = 'none';
      _tpFill.style.transform = 'scaleX(0)';
    }, 240);
  }, 200);
}

// Button busy state: spinner inside the button, text hidden, click blocked.
window.setBusy = function(btn, on) {
  if (!btn) return;
  btn.classList.toggle('is-busy', !!on);
  btn.disabled = !!on;
};

window.fetch = function(url, opts = {}) {
  if (!opts.signal) opts.signal = _pageAC.signal;
  const quiet = (opts.method || 'GET').toUpperCase() === 'GET'
    && _POLL_RE.test(String(url));
  _tpStart(quiet);
  const p = _origFetch.call(this, url, opts);
  p.then(() => _tpEnd(quiet), () => _tpEnd(quiet));
  return p;
};
// pagehide covers real navigation AND bfcache entry (beforeunload does not
// fire for bfcache in some browsers, leaving requests running after leaving).
window.addEventListener('pagehide', () => { _pageAC.abort(); });
// On bfcache restore the document returns with an already-aborted controller,
// which would make every later fetch fail instantly. Hand it a fresh one.
window.addEventListener('pageshow', (e) => {
  if (e.persisted) _pageAC = new AbortController();
});
function pageSignal() { return _pageAC.signal; }
function applyRoleVisibility() {
  const isAdmin = window.CURRENT_USER && window.CURRENT_USER.role === 'admin';
  document.querySelectorAll('.admin-only').forEach(el => {
    el.classList.toggle('hidden', !isAdmin);
  });
  const active = document.body.getAttribute('data-active');
  if (active) {
    const node = document.getElementById('nav' + active.charAt(0).toUpperCase() + active.slice(1));
    if (node) node.classList.add('active');
  }
}
async function refreshNavStats() {
  try {
    const r = await fetch('/api/db/stats');
    if (!r.ok) return;
    renderNavStats(await r.json());
  } catch (e) {}
}
async function refreshUser() {
  try {
    const r = await fetch('/api/auth/me');
    const data = await r.json();
    window.CURRENT_USER = data.user;
  } catch (e) {}
  const el = document.getElementById('navUser');
  if (!el) return;
  if (window.CURRENT_USER) {
    const u = window.CURRENT_USER;
    const role = u.role === 'admin' ? '<span class="role-badge role-admin">admin</span>' : '<span class="role-badge role-staff">staff</span>';
    el.innerHTML = `${role}
      <span class="nav-user-name">${escapeHtml(u.display_name || u.username)}</span>
      <a href="/change_password" class="nav-btn" title="修改登录密码">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.3-8.3"/><path d="m15.5 7.5 2.5 2.5"/><path d="m18.5 4.5 2 2"/></svg>
        <span class="nav-btn-label">改密码</span>
      </a>
      <a href="#" id="logoutBtn" class="nav-btn" title="退出登录">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="nav-btn-label">退出</span>
      </a>`;
    document.getElementById('logoutBtn').onclick = async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', {method: 'POST'});
      location.href = '/login';
    };
  } else {
    el.innerHTML = '<a href="/login">登录</a>';
  }
  applyRoleVisibility();
}

// One request for the whole page shell (user + nav counters + staff list +
// active background jobs). Previously every page fired 3-5 separate requests on
// load; this is a single round trip against a single DB connection.
async function refreshShell() {
  let data = null;
  try {
    const r = await fetch('/api/bootstrap');
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data) {                       // bootstrap unavailable → degrade to the old calls
    await refreshUser();
    await refreshNavStats();
    return;
  }
  window.CURRENT_USER = data.user;
  window.STAFF_LIST = data.staff || [];
  window.ACTIVE_JOBS = data.active_jobs || {};
  renderNavStats(data.nav_stats);
  renderNavUser(data.user);
  applyRoleVisibility();
}

function renderNavStats(s) {
  if (!s) return;
  const by = s.by_platform || {};
  const cls = {instagram: 'is-ig', tiktok: 'is-tt', x: 'is-x'};
  const parts = [`<b>${s.people}</b>人`, `<b>${s.total}</b>账号`];
  for (const p of ALL_PLATFORMS) {
    parts.push(`<span class="nav-stat ${cls[p] || ''}"><b>${by[p] || 0}</b>${PLATFORM_LABEL[p]}</span>`);
  }
  const el = document.getElementById('navStatsBar');
  // First two are plain totals; the platform chips carry their own colour.
  if (el) el.innerHTML = parts.map((p, i) => i < 2 ? `<span class="nav-stat">${p}</span>` : p).join('');
}

function renderNavUser(u) {
  const el = document.getElementById('navUser');
  if (!el) return;
  if (!u) { el.innerHTML = '<a href="/login">登录</a>'; return; }
  const role = u.role === 'admin'
    ? '<span class="role-badge role-admin">admin</span>'
    : '<span class="role-badge role-staff">staff</span>';
  el.innerHTML = `${role}
    <span class="nav-user-name">${escapeHtml(u.display_name || u.username)}</span>
    <a href="/change_password" class="nav-btn" title="修改登录密码">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.3-8.3"/><path d="m15.5 7.5 2.5 2.5"/><path d="m18.5 4.5 2 2"/></svg>
      <span class="nav-btn-label">改密码</span>
    </a>
    <a href="#" id="logoutBtn" class="nav-btn" title="退出登录">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      <span class="nav-btn-label">退出</span>
    </a>`;
  const btn = document.getElementById('logoutBtn');
  if (btn) btn.onclick = async (e) => {
    e.preventDefault();
    await fetch('/api/auth/logout', {method: 'POST'});
    location.href = '/login';
  };
}

refreshShell();

// When the nav collapses to icons (<=1020px) the labels are display:none, so
// give every link a native tooltip with the text it no longer shows.
document.querySelectorAll('.navlink').forEach(a => {
  if (!a.title) a.title = (a.textContent || '').trim();
});

// shared helpers
function fmt(n) {
  if (n == null || n === '') return '-';
  n = +n;
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toString();
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function platformTag(p) {
  return `<span class="platform-tag platform-${p}">${p}</span>`;
}

// Small non-blocking notification. Replaces alert() for routine confirmations
// (alert steals focus, blocks the thread and looks dated).
function toast(msg, kind) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 220);
  }, 2600);
}

// Placeholder rows shaped like a real list/table, used while a fetch is in
// flight so the page never flashes "加载中…" text or jumps when data lands.
function skeletonList(rows, opts) {
  const o = opts || {};
  const withAvatar = o.avatar !== false;
  let html = '';
  for (let i = 0; i < rows; i++) {
    const w1 = 30 + ((i * 17) % 40);
    const w2 = 45 + ((i * 23) % 35);
    html += `<div class="sk-row">
      ${withAvatar ? '<div class="skeleton sk-av"></div>' : ''}
      <div class="sk-col">
        <div class="skeleton sk-line" style="width:${w1}%"></div>
        <div class="skeleton sk-line" style="width:${w2}%;opacity:.7"></div>
      </div>
    </div>`;
  }
  return html;
}

function skeletonTable(cols, rows, widths) {
  const ws = widths || [];
  let html = '<table class="crm-table"><thead><tr>';
  for (let i = 0; i < cols; i++) {
    html += `<th style="min-width:${ws[i] || 120}px;">`
         + `<div class="skeleton sk-line" style="width:${40 + (i * 7) % 40}%"></div></th>`;
  }
  html += '</tr></thead><tbody>';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let i = 0; i < cols; i++) {
      html += `<td><div class="skeleton sk-line" style="width:${35 + ((r * 13 + i * 19) % 55)}%"></div></td>`;
    }
    html += '</tr>';
  }
  return html + '</tbody></table>';
}
function renderAccount(a, opts={}) {
  const stats = [];
  if (a.follower_count != null) stats.push(`<b>${fmt(a.follower_count)}</b> 粉丝`);
  if (a.following_count != null) stats.push(`<b>${fmt(a.following_count)}</b> 关注`);
  if (a.post_count != null) stats.push(`<b>${fmt(a.post_count)}</b> 帖子`);
  const cat = a.category ? `<span class="cat-tag">${escapeHtml(a.category)}</span>` : '';
  const verified = a.is_verified ? '<span class="verified">&#10003;</span>' : '';
  const contact = [];
  if (a.email) contact.push(`&#9993; ${escapeHtml(a.email)}`);
  if (a.phone) contact.push(`&#9742; ${escapeHtml(a.phone)}`);
  const contactHtml = contact.length ? `<div class="contact">${contact.join(' · ')}</div>` : '';
  const bio = a.biography ? `<div class="bio">${escapeHtml(a.biography.replace(/\n/g,' · '))}</div>` : '';
  const src = a.source ? `<div class="source">来源：${escapeHtml(a.source)}</div>` : '';
  const score = (opts.showScore && a.score != null) ? `<span class="score-pill">匹配度 ${(a.score*100).toFixed(0)}%</span>` : '';
  const cb = opts.checkbox ? `<input type="checkbox" class="select-cb" data-id="${a.id}">` : '';
  // Avatar: a fixed 40px box that always occupies its slot. The initials sit
  // underneath and the <img> is layered on top, so a missing / 404 / blocked
  // picture simply reveals the initials — the old onerror="display:none"
  // removed the box entirely and the name text slid left, which read as a
  // broken row. src="" is never emitted (it makes the browser re-request the
  // current page, once per row) and lazy+async keeps a long batch cheap.
  const initial = ((a.username || a.full_name || '?') + '').trim().slice(0, 1).toUpperCase() || '?';
  const avatar = `<div class="avatar">${escapeHtml(initial)}${
    a.profile_pic_url
      ? `<img src="${a.profile_pic_url}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add('is-loaded')" onerror="this.remove()">`
      : ''
  }</div>`;
  return `<div class="result-item" data-id="${a.id}">
    ${cb}
    ${avatar}
    <div class="info">
      <div class="name">${platformTag(a.platform)} @${escapeHtml(a.username)} ${verified} <span class="full">${escapeHtml(a.full_name)}</span> ${cat} ${score}</div>
      <div class="meta">${stats.join(' · ') || '<span style="color:var(--text-3)">暂无统计数据</span>'}</div>
      ${bio}
      ${contactHtml}
      ${src}
    </div>
  </div>`;
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
